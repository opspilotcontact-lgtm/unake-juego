  <title>Unaké · la noche</title>

  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">
  <style>
    :root { --tinta: #1b1028; }
    html, body { margin: 0; height: 100%; background: var(--tinta); overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #juego { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { touch-action: none; }
    /* En el móvil en vertical: que lo gire (el juego es horizontal). */
    #girar { display: none; position: fixed; inset: 0; z-index: 10; background: var(--tinta); color: #fff6e8;
      font-family: 'Caprasimo', serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 24px; }
    #girar .movil { width: 64px; height: 110px; border: 6px solid #ffd23f; border-radius: 14px; animation: girar 1.8s ease-in-out infinite; }
    #girar p { font-size: 26px; margin: 0; }
    #girar small { font-size: 16px; color: #5ad1ff; }
    @keyframes girar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
  </style>
</head>

  <div id="juego"></div>
  <div id="girar"><div class="movil"></div><p>Gira el móvil</p><small>Unaké se juega en horizontal</small></div>
